[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plotify"
version = "1.0.0"
description = "Residential plot price estimation from scraped property listings: data processing, model selection, web app and API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "joblib>=1.3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "waitress>=3.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
scrape = ["selenium>=4.10"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
plotify = "plotify.__main__:main"

[tool.setuptools]
packages = ["plotify"]

[tool.setuptools.package-data]
plotify = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::FutureWarning", "error::DeprecationWarning:plotify.*"]
